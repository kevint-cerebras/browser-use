<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout — Marketplace Search</title>
<style>
:root{color-scheme:dark;--bg:#090909;--soft:#181818;--line:#292929;--muted:#929292;--ink:#f4f4f2;--blue:#7cb7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,textarea{font:inherit}.app,.chat{height:100vh}.chat{display:flex;flex-direction:column;min-width:0}.top{min-height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}.mark{width:31px;height:31px;flex:0 0 auto;border-radius:10px;background:#f4f4f2;color:#090909;display:grid;place-items:center;font-weight:900;font-size:18px}.brand{font-weight:650;letter-spacing:-.02em}.runstate{display:flex;gap:10px;margin-left:auto;color:var(--muted);font-size:11px}.runstate strong{color:#ddd;font-weight:550}.conversation{flex:1;overflow:auto;padding:30px 22px 176px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}.conversation h1{font-size:30px;line-height:1.08;letter-spacing:-.045em;margin:0 0 14px}.intro{color:#aaa;line-height:1.55;margin:0 0 28px}.message{background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:15px 16px;line-height:1.5;margin:11px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.agent{background:transparent;padding-left:0;border:0}.beats{display:flex;gap:5px;margin:16px 0 8px}.beat{height:4px;flex:1;background:#242424;border-radius:9px}.beat.on{background:var(--blue)}.statusline{color:var(--muted);font-size:12px}.composer-wrap{position:fixed;left:0;bottom:0;width:25vw;min-width:320px;padding:20px 16px 24px;background:linear-gradient(transparent,#090909 24%)}.composer{background:#181818;border:1px solid #303030;border-radius:22px;padding:12px 12px 9px;box-shadow:0 18px 50px #0008}.composer textarea{width:100%;height:84px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);line-height:1.45;padding:3px 4px}.actions{display:flex;align-items:center;gap:7px;margin-top:6px}.model{color:var(--muted);font-size:10px;padding-left:4px;white-space:nowrap}.run,.stop{border:0;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:650;cursor:pointer}.run{margin-left:auto;background:#f2f2ef;color:#090909}.stop{background:#292929;color:#ddd}.run:disabled{opacity:.4;cursor:not-allowed}@media(max-width:700px){.composer-wrap{width:100%;min-width:0}.runstate span:first-child{display:none}.conversation{padding-bottom:184px}}
.composer-wrap{width:100%;min-width:0}.results h2{font-size:23px;letter-spacing:-.035em;margin:0 0 15px}.option{border:1px solid var(--line);border-radius:16px;background:#111;padding:14px;margin:10px 0}.option-top{display:flex;align-items:flex-start;gap:10px}.option-title{font-weight:650;line-height:1.35;flex:1}.price{font-weight:700;white-space:nowrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:12px 0;color:#aaa;font-size:11px}.details b{display:block;color:#666;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}.listing-link{display:inline-block;color:var(--blue);font-size:12px;text-decoration:none;margin-top:2px}.listing-link:hover{text-decoration:underline}.result-note{color:#888;font-size:11px;line-height:1.5;margin-top:13px;white-space:pre-wrap}
</style>
</head>
<body><main class="app"><section class="chat">
<header class="top"><div class="mark">S</div><div class="brand">Scout</div><div class="runstate"><span>Status <strong id="status">Ready</strong></span><span>Step <strong id="step">0</strong></span><span><strong id="runtime">0.0s</strong></span></div></header>
<div class="conversation" id="conversation"><div class="eyebrow">Marketplace agent</div><h1>What should I find?</h1><p class="intro">Sign in in the Marketplace window, then describe the listings you want to find. Scout reports ranked options and any authorized outreach here.</p><div id="thread"></div></div>
<div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="Describe a Marketplace search…"></textarea><div class="actions"><span class="model">qwen-3.8-27b</span><button class="stop" id="stop" hidden>Stop</button><button class="run" id="run">Search ↑</button></div></div></div>
</section></main><script>
const $=id=>document.getElementById(id),run=$('run'),stop=$('stop'),thread=$('thread'),prompt=$('prompt');let active=null,timer=null,finished=false;
function message(kind,text){const d=document.createElement('div');d.className='message '+kind;d.textContent=text;thread.appendChild(d);$('conversation').scrollTop=$('conversation').scrollHeight}
function showPlan(){const d=document.createElement('div');d.className='message agent';d.innerHTML=`<div class="eyebrow">Search plan</div><div class="beats">${Array(5).fill('<i class="beat"></i>').join('')}</div><div class="statusline" id="story">Interpreting request…</div>`;thread.appendChild(d)}
function field(label,value){const d=document.createElement('div'),b=document.createElement('b');b.textContent=label;d.append(b,document.createTextNode(value||'Not shown'));return d}
function renderResults(text){const lines=text.split('\n'),options=[],notes=[];for(const line of lines){const parts=line.split('\t');if(parts[0]==='OPTION'&&parts.length>=11)options.push(parts.slice(1,11));else if(['COVERAGE','LIMITATIONS','EXCLUDED'].includes(parts[0]))notes.push(`${parts[0][0]+parts[0].slice(1).toLowerCase()}: ${parts.slice(1).join(' ')}`)}if(!options.length){message('agent',text||'No qualifying listings were returned.');return}const wrap=document.createElement('div');wrap.className='message agent results';const heading=document.createElement('h2');heading.textContent='Here are your options';wrap.appendChild(heading);for(const [title,price,location,condition,seller,rating,delivery,url,offer,messageStatus] of options){const card=document.createElement('article');card.className='option';const top=document.createElement('div');top.className='option-top';const name=document.createElement('div');name.className='option-title';name.textContent=title;const cost=document.createElement('div');cost.className='price';cost.textContent=price;top.append(name,cost);const details=document.createElement('div');details.className='details';details.append(field('Location',location),field('Condition',condition),field('Seller',seller),field('Seller rating',rating),field('Delivery',delivery),field('Offer',offer),field('Message',messageStatus));card.append(top,details);try{const target=new URL(url);if(target.hostname.endsWith('facebook.com')&&target.pathname.includes('/marketplace/')){const link=document.createElement('a');link.className='listing-link';link.href=target.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open listing ↗';card.appendChild(link)}}catch{}wrap.appendChild(card)}if(notes.length){const note=document.createElement('div');note.className='result-note';note.textContent=notes.join('\n\n');wrap.appendChild(note)}thread.appendChild(wrap);$('conversation').scrollTop=$('conversation').scrollHeight}
function render(s){$('status').textContent=s.status[0].toUpperCase()+s.status.slice(1);$('step').textContent=s.step;$('runtime').textContent=s.elapsed.toFixed(1)+'s';const snap=s.snapshot;if(snap?.thinking&&$('story'))$('story').textContent=snap.thinking;const labels=['Interpreting request','Searching Marketplace','Checking listings','Deduplicating results','Preparing inventory'],count=Math.min(5,Math.max(1,Math.ceil(s.step/4)));document.querySelectorAll('.beat').forEach((e,i)=>e.classList.toggle('on',i<count));if($('story')&&!snap?.thinking)$('story').textContent=labels[count-1]+'…';if(['completed','failed','stopped','closed'].includes(s.status)&&!finished){finished=true;clearInterval(timer);run.disabled=false;stop.hidden=true;renderResults(s.final_result||`Run ${s.status}. See terminal output for details.`)}}
async function poll(){if(!active)return;const r=await fetch('/api/runs/'+active);if(r.ok)render(await r.json())}
run.onclick=async()=>{const text=prompt.value.trim();if(!text)return;finished=false;run.disabled=true;stop.hidden=false;message('user',text);const r=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:text})});const s=await r.json();if(!r.ok){message('agent',s.error);run.disabled=false;stop.hidden=true;return}active=s.id;showPlan();render(s);timer=setInterval(poll,700)};
stop.onclick=async()=>{if(!active)return;await fetch(`/api/runs/${active}/control`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'stop'})});poll()};
</script></body></html>
