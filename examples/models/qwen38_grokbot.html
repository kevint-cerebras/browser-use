<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout — Shopping Agent</title>
<style>
:root{color-scheme:dark;--bg:#090909;--soft:#181818;--line:#292929;--muted:#929292;--ink:#f4f4f2;--green:#73d29f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,textarea{font:inherit}.app{height:100vh}.chat{display:flex;flex-direction:column;width:min(900px,100%);height:100vh;margin:auto;min-width:0}.top{height:62px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}.mark{width:31px;height:31px;border-radius:10px;background:#f4f4f2;color:#090909;display:grid;place-items:center;font-weight:900;font-size:18px}.brand{font-weight:650;letter-spacing:-.02em}.tag{color:var(--muted);font-size:12px}.runstate{display:flex;align-items:center;gap:14px;margin-left:auto;color:var(--muted);font-size:11px}.runstate strong{color:#ddd;font-weight:550}.conversation{flex:1;overflow:auto;padding:38px clamp(22px,7vw,72px) 170px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.conversation h1{font-size:34px;line-height:1.08;letter-spacing:-.045em;margin:0 0 14px;max-width:540px}.intro{color:#aaa;line-height:1.55;max-width:550px;margin-bottom:32px}.message{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:16px 18px;line-height:1.5;margin:12px 0;white-space:pre-wrap}.message.agent{background:transparent;padding-left:0;border:0}.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#111}.metric b{display:block;font-size:20px;margin-bottom:3px}.metric span{font-size:11px;color:var(--muted)}.beats{display:flex;gap:5px;margin:18px 0 8px}.beat{height:4px;flex:1;background:#242424;border-radius:9px}.beat.on{background:var(--green)}.statusline{color:var(--muted);font-size:12px}.composer-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(900px,100%);padding:22px clamp(22px,7vw,72px) 26px;background:linear-gradient(transparent,#090909 26%)}.composer{background:#181818;border:1px solid #303030;border-radius:24px;padding:13px 14px 10px;box-shadow:0 18px 50px #0008}.composer textarea{width:100%;height:72px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);line-height:1.45;padding:3px 4px}.actions{display:flex;align-items:center;gap:9px;margin-top:7px}.model{color:var(--muted);font-size:12px;padding-left:4px}.run,.stop{border:0;border-radius:999px;padding:10px 16px;font-weight:650;cursor:pointer}.run{margin-left:auto;background:#f2f2ef;color:#090909}.stop{background:#292929;color:#ddd}.run:disabled{opacity:.4;cursor:not-allowed}@media(max-width:620px){.tag{display:none}.runstate span:first-child{display:none}.conversation{padding-bottom:170px}.brief{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="app">
<section class="chat"><header class="top"><div class="mark">S</div><div class="brand">Scout</div><div class="tag">Browser shopping agent</div><div class="runstate"><span>Status <strong id="status">Ready</strong></span><span>Step <strong id="step">0</strong></span><span><strong id="runtime">0.0s</strong></span></div></header><div class="conversation" id="conversation"><div class="eyebrow">Browser agent</div><h1>What should I do in the browser?</h1><p class="intro">Describe what to shop for in your own words. The agent works in the separate Chrome window and reports progress here.</p><div id="thread"></div></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="Describe a shopping task…"></textarea><div class="actions"><span class="model">qwen-3.8-27b · Cerebras</span><button class="stop" id="stop" hidden>Stop</button><button class="run" id="run">Start shopping ↑</button></div></div></div></section>
</main><script>
const $=id=>document.getElementById(id),run=$('run'),stop=$('stop'),thread=$('thread'),prompt=$('prompt');let active=null,timer=null,finished=false,currentStatus='ready';
function message(kind,text){const d=document.createElement('div');d.className='message '+kind;d.textContent=text;thread.appendChild(d);$('conversation').scrollTop=$('conversation').scrollHeight}
function showBrief(b){const d=document.createElement('div');d.className='message agent';const cards=b.metrics.map(m=>`<div class="metric"><b>${m.value}</b><span>${m.label}</span></div>`).join('');d.innerHTML=`<div class="eyebrow">Parsed from your request</div>${cards?`<div class="brief">${cards}</div>`:'<p class="statusline">No numeric constraints were inferred.</p>'}<div class="beats">${Array(6).fill('<i class="beat"></i>').join('')}</div><div class="statusline" id="story">Understanding request…</div>`;thread.appendChild(d)}
function render(s){currentStatus=s.status;$('status').textContent=s.status[0].toUpperCase()+s.status.slice(1);$('step').textContent=s.step;$('runtime').textContent=s.elapsed.toFixed(1)+'s';stop.textContent=s.status==='waiting'?'Finish run':'Stop';const snap=s.snapshot;if(snap?.thinking&&$('story'))$('story').textContent=snap.thinking;const labels=['Understanding request','Searching Amazon','Comparing options','Building cart','Verifying constraints','Checkout boundary'],count=Math.min(6,Math.max(1,Math.ceil(s.step/3)));document.querySelectorAll('.beat').forEach((e,i)=>e.classList.toggle('on',i<count));if($('story')&&!snap?.thinking)$('story').textContent=labels[count-1]+'…';if(['completed','failed','stopped','closed'].includes(s.status)&&!finished){finished=true;clearInterval(timer);run.disabled=false;stop.hidden=true;message('agent',s.final_result||`Run ${s.status}. See terminal output for details.`)}}
async function poll(){if(!active)return;const r=await fetch('/api/runs/'+active);if(r.ok)render(await r.json())}
run.onclick=async()=>{const text=prompt.value.trim();if(!text)return;finished=false;run.disabled=true;stop.hidden=false;message('user',text);const r=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:text})});const s=await r.json();if(!r.ok){message('agent',s.error);run.disabled=false;stop.hidden=true;return}active=s.id;showBrief(s.brief);render(s);timer=setInterval(poll,700)};
stop.onclick=async()=>{if(!active)return;const action=currentStatus==='waiting'?'close_browser':'stop';await fetch(`/api/runs/${active}/control`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action})});poll()};
</script></body></html>
